<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenEditor Pro</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="brand">Gen<span>Editor</span></div>
        <div class="toolbar">
            <select id="libSelector">
                <option value="">+ Add Framework</option>
                <option value="bootstrap">Bootstrap 5</option>
                <option value="tailwind">Tailwind CSS</option>
                <option value="vue">Vue 3</option>
                <option value="react">React</option>
                <option value="jquery">jQuery</option>
            </select>

            <select id="presetSelector">
                <option value="" disabled selected>Preset...</option>
                <optgroup label="Starters">
                    <option value="empty">Empty</option>
                    <option value="flex">Flexbox</option>
                    <option value="grid">Grid</option>
                </optgroup>
                <optgroup label="User Saved" id="userPresetsGroup">
                    </optgroup>
            </select>

            <button class="icon-btn" onclick="downloadProject()" title="Download Project">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
            <button class="icon-btn" onclick="shareProject()" title="Share Link">
                <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            </button>
            <button class="icon-btn" onclick="saveUserPreset()" title="Save Preset">
                <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            </button>

            <button class="action-btn" onclick="run()">
                <svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span class="action-text">Run</span>
            </button>
        </div>
    </header>

    <div class="main-container">
        <!-- Mobile Tabs -->
        <div class="mobile-tabs">
            <button class="tab-btn active" onclick="switchTab(0)">HTML</button>
            <button class="tab-btn" onclick="switchTab(1)">CSS</button>
            <button class="tab-btn" onclick="switchTab(2)">JS</button>
        </div>

        <div class="editors">
            <div class="editor-group active">
                <div class="editor-label html">HTML
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
                <div class="editor-wrapper">
                    <!-- Line Numbers are purely visual/generated via JS in a real IDE, skipping complex sync logic for now to keep it lightweight -->
                    <textarea id="html" spellcheck="false" placeholder="<!-- Structure -->"></textarea>
                </div>
            </div>
            <div class="editor-group">
                <div class="editor-label css">CSS
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                </div>
                <textarea id="css" spellcheck="false" placeholder="/* Styles */"></textarea>
            </div>
            <div class="editor-group">
                <div class="editor-label js">JS
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm16 16V5H5v14h14zM9 11h6v2H9v-2z"/></svg>
                </div>
                <textarea id="js" spellcheck="false" placeholder="// Logic"></textarea>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="preview-wrapper">
            <iframe id="preview"></iframe>
            <div id="console" class="console">
                <div class="console-header">Console Output</div>
            </div>
            <button id="consoleBtn" onclick="toggleConsole()">Console</button>
        </div>
    </div>

    <div id="status">Saved!</div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
